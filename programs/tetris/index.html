<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tetris</title>
<style>
  :root {
    --bg: #12141c;
    --panel: #1c1f2b;
    --line: #2c3040;
    --text: #e6e8f0;
    --muted: #8b90a5;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, "Segoe UI", sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
  }
  .game { display: flex; gap: 20px; align-items: flex-start; }
  canvas {
    background: #0b0d14;
    border: 2px solid var(--line);
    border-radius: 6px;
    display: block;
  }
  .side { width: 150px; display: flex; flex-direction: column; gap: 14px; }
  .box {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 10px 12px;
  }
  .box h2 {
    margin: 0 0 6px;
    font-size: 11px;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: var(--muted);
    font-weight: 600;
  }
  .box .val { font-size: 24px; font-variant-numeric: tabular-nums; }
  #next { background: transparent; border: 0; }
  .help { font-size: 12px; line-height: 1.7; color: var(--muted); }
  .help b { color: var(--text); font-weight: 600; }
  #msg {
    position: fixed;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    background: rgba(10, 12, 18, .82);
    font-size: 28px;
    text-align: center;
    line-height: 1.5;
  }
  #msg small { display: block; font-size: 14px; color: var(--muted); margin-top: 10px; }
</style>
</head>
<body>

<div class="game">
  <canvas id="board" width="300" height="600"></canvas>
  <div class="side">
    <div class="box">
      <h2>Další</h2>
      <canvas id="next" width="120" height="90"></canvas>
    </div>
    <div class="box"><h2>Skóre</h2><div class="val" id="score">0</div></div>
    <div class="box"><h2>Řádky</h2><div class="val" id="lines">0</div></div>
    <div class="box"><h2>Úroveň</h2><div class="val" id="level">1</div></div>
    <div class="box help">
      <b>&larr; &rarr;</b> pohyb<br>
      <b>&uarr;</b> otočit<br>
      <b>&darr;</b> zrychlit<br>
      <b>mezerník</b> shodit<br>
      <b>P</b> pauza
    </div>
  </div>
</div>

<div id="msg"></div>

<script>
const COLS = 10, ROWS = 20, CELL = 30;

const ctx = document.getElementById('board').getContext('2d');
const nctx = document.getElementById('next').getContext('2d');
const msgEl = document.getElementById('msg');

// Tetromina: bloky v mřížce size x size, rotace se počítá za běhu.
const SHAPES = {
  I: { color: '#38bdf8', size: 4, cells: [[0,1],[1,1],[2,1],[3,1]] },
  J: { color: '#60a5fa', size: 3, cells: [[0,0],[0,1],[1,1],[2,1]] },
  L: { color: '#fb923c', size: 3, cells: [[2,0],[0,1],[1,1],[2,1]] },
  O: { color: '#facc15', size: 4, cells: [[1,0],[2,0],[1,1],[2,1]] },
  S: { color: '#4ade80', size: 3, cells: [[1,0],[2,0],[0,1],[1,1]] },
  T: { color: '#c084fc', size: 3, cells: [[1,0],[0,1],[1,1],[2,1]] },
  Z: { color: '#f87171', size: 3, cells: [[0,0],[1,0],[1,1],[2,1]] }
};
const TYPES = Object.keys(SHAPES);

let board, piece, next, bag = [];
let score, lines, level, dropTimer, dropInterval, lastTime;
let paused = false, gameOver = false;

function emptyBoard() {
  return Array.from({ length: ROWS }, () => Array(COLS).fill(null));
}

// Výběr "z pytle" - každý tvar jednou za sedm kusů.
function nextType() {
  if (!bag.length) {
    bag = TYPES.slice();
    for (let i = bag.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [bag[i], bag[j]] = [bag[j], bag[i]];
    }
  }
  return bag.pop();
}

function makePiece(type) {
  const s = SHAPES[type];
  return { type, color: s.color, size: s.size, cells: s.cells.map(c => c.slice()), x: 3, y: 0 };
}

function rotate(cells, size) {
  return cells.map(([x, y]) => [size - 1 - y, x]);
}

function collides(p, cells, ox, oy) {
  return cells.some(([cx, cy]) => {
    const x = p.x + cx + ox, y = p.y + cy + oy;
    return x < 0 || x >= COLS || y >= ROWS || (y >= 0 && board[y][x]);
  });
}

function spawn() {
  piece = makePiece(next);
  next = nextType();
  drawNext();
  if (collides(piece, piece.cells, 0, 0)) {
    gameOver = true;
    draw();
    showMsg('Konec hry<small>Skóre ' + score + ' &mdash; Enter spustí novou hru</small>');
  }
}

function move(dx) {
  if (!collides(piece, piece.cells, dx, 0)) piece.x += dx;
}

function tryRotate() {
  const rotated = rotate(piece.cells, piece.size);
  for (const kick of [0, -1, 1, -2, 2]) {   // odsunutí od stěny
    if (!collides(piece, rotated, kick, 0)) {
      piece.cells = rotated;
      piece.x += kick;
      return;
    }
  }
}

function softDrop() {
  if (collides(piece, piece.cells, 0, 1)) { lock(); return false; }
  piece.y++;
  dropTimer = 0;
  return true;
}

function hardDrop() {
  while (!collides(piece, piece.cells, 0, 1)) { piece.y++; score += 2; }
  lock();
}

function lock() {
  piece.cells.forEach(([cx, cy]) => {
    const y = piece.y + cy;
    if (y >= 0) board[y][piece.x + cx] = piece.color;
  });
  clearLines();
  spawn();
}

function clearLines() {
  let cleared = 0;
  for (let y = ROWS - 1; y >= 0; y--) {
    if (board[y].every(c => c)) {
      board.splice(y, 1);
      board.unshift(Array(COLS).fill(null));
      cleared++;
      y++;   // stejný index znovu, řádky se posunuly dolů
    }
  }
  if (!cleared) return;
  score += [0, 100, 300, 500, 800][cleared] * level;
  lines += cleared;
  level = Math.floor(lines / 10) + 1;
  dropInterval = Math.max(80, 800 - (level - 1) * 70);
  updateStats();
}

function updateStats() {
  document.getElementById('score').textContent = score;
  document.getElementById('lines').textContent = lines;
  document.getElementById('level').textContent = level;
}

function drawCell(c, x, y, color, size) {
  size = size || CELL;
  c.fillStyle = color;
  c.fillRect(x * size, y * size, size, size);
  c.fillStyle = 'rgba(255,255,255,.22)';
  c.fillRect(x * size, y * size, size, 3);
  c.strokeStyle = 'rgba(0,0,0,.45)';
  c.lineWidth = 1;
  c.strokeRect(x * size + .5, y * size + .5, size - 1, size - 1);
}

function draw() {
  ctx.clearRect(0, 0, COLS * CELL, ROWS * CELL);

  ctx.strokeStyle = 'rgba(255,255,255,.04)';
  for (let x = 1; x < COLS; x++) {
    ctx.beginPath(); ctx.moveTo(x * CELL, 0); ctx.lineTo(x * CELL, ROWS * CELL); ctx.stroke();
  }
  for (let y = 1; y < ROWS; y++) {
    ctx.beginPath(); ctx.moveTo(0, y * CELL); ctx.lineTo(COLS * CELL, y * CELL); ctx.stroke();
  }

  for (let y = 0; y < ROWS; y++) {
    for (let x = 0; x < COLS; x++) {
      if (board[y][x]) drawCell(ctx, x, y, board[y][x]);
    }
  }

  if (piece && !gameOver) {
    let ghost = 0;                                   // náhled dopadu
    while (!collides(piece, piece.cells, 0, ghost + 1)) ghost++;
    ctx.globalAlpha = .2;
    piece.cells.forEach(([cx, cy]) => drawCell(ctx, piece.x + cx, piece.y + cy + ghost, piece.color));
    ctx.globalAlpha = 1;

    piece.cells.forEach(([cx, cy]) => {
      if (piece.y + cy >= 0) drawCell(ctx, piece.x + cx, piece.y + cy, piece.color);
    });
  }
}

function drawNext() {
  const size = 20;
  nctx.clearRect(0, 0, 120, 90);
  const cells = SHAPES[next].cells;
  const xs = cells.map(c => c[0]), ys = cells.map(c => c[1]);
  const offX = (120 - (Math.max.apply(null, xs) - Math.min.apply(null, xs) + 1) * size) / 2 - Math.min.apply(null, xs) * size;
  const offY = (90 - (Math.max.apply(null, ys) - Math.min.apply(null, ys) + 1) * size) / 2 - Math.min.apply(null, ys) * size;
  nctx.save();
  nctx.translate(offX, offY);
  cells.forEach(([x, y]) => drawCell(nctx, x, y, SHAPES[next].color, size));
  nctx.restore();
}

function showMsg(html) {
  msgEl.innerHTML = html;
  msgEl.style.display = 'flex';
}
function hideMsg() { msgEl.style.display = 'none'; }

function loop(time) {
  time = time || 0;
  const dt = time - lastTime;
  lastTime = time;

  if (!paused && !gameOver) {
    dropTimer += dt;
    if (dropTimer > dropInterval) { dropTimer = 0; softDrop(); }
    draw();
  }
  requestAnimationFrame(loop);
}

function reset() {
  board = emptyBoard();
  bag = [];
  score = 0; lines = 0; level = 1;
  dropInterval = 800; dropTimer = 0; lastTime = performance.now();
  paused = false; gameOver = false;
  next = nextType();
  spawn();
  updateStats();
  hideMsg();
}

document.addEventListener('keydown', e => {
  if (gameOver) {
    if (e.key === 'Enter') reset();
    return;
  }
  if (e.key === 'p' || e.key === 'P') {
    paused = !paused;
    if (paused) {
      showMsg('Pauza<small>P pro pokračování</small>');
    } else {
      hideMsg();
      lastTime = performance.now();
    }
    return;
  }
  if (paused) return;

  switch (e.key) {
    case 'ArrowLeft':  move(-1); break;
    case 'ArrowRight': move(1); break;
    case 'ArrowUp':    tryRotate(); break;
    case 'ArrowDown':  if (softDrop()) score += 1; updateStats(); break;
    case ' ':          hardDrop(); updateStats(); break;
    default: return;
  }
  e.preventDefault();
  draw();
});

reset();
loop();
</script>
</body>
</html>
