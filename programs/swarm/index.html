<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Hejno a dravec</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="c"></canvas>

<div id="panel" class="glass">
  <div class="head">
    <div class="logo"><span class="dot"></span>Hejno</div>
    <button id="collapse" class="icon-btn" title="Skrýt panel (H)">–</button>
  </div>
  <div class="body">
    <div id="scenes" class="scenes"></div>

    <div class="sliders">
      <label><span>Počet</span><b id="v-count"></b><input type="range" id="s-count" min="50" max="3000" step="10"></label>
      <label><span>Soudržnost</span><b id="v-cohesion"></b><input type="range" id="s-cohesion" min="0" max="3" step="0.05"></label>
      <label><span>Zarovnání</span><b id="v-alignment"></b><input type="range" id="s-alignment" min="0" max="3" step="0.05"></label>
      <label><span>Odstup</span><b id="v-separation"></b><input type="range" id="s-separation" min="0" max="3" step="0.05"></label>
      <label><span>Strach</span><b id="v-fear"></b><input type="range" id="s-fear" min="0" max="2.5" step="0.05"></label>
      <label><span>Rychlost</span><b id="v-speed"></b><input type="range" id="s-speed" min="0.3" max="2" step="0.05"></label>
    </div>

    <div class="row">
      <button id="addPred" class="btn">+ Dravec</button>
      <button id="delPred" class="btn">− Dravec</button>
      <button id="trails" class="btn toggle" title="Stopy (T)">Stopy</button>
    </div>

    <div class="stats">
      <span>Uloveno <b id="caught">0</b></span>
      <span>Dravci <b id="predCount">1</b></span>
      <span id="fps"></span>
    </div>
  </div>
</div>

<div id="hint">Pohybuj myší — jsi dravec · <b>klik</b> = výpad · <b>1–4</b> scény · <b>H</b> panel · <b>T</b> stopy</div>

<div id="title"><div class="t-name"></div><div class="t-sub"></div></div>

<script src="swarm.js"></script>
</body>
</html>
